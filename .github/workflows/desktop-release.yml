# GitHub Actions workflow for releasing desktop app
# Creates a GitHub release with all platform artifacts

name: Desktop Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build for all platforms
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd apps/desktop
          pnpm tauri build --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd apps/desktop
          pnpm tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd apps/desktop
          pnpm tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  # Create GitHub Release
  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Scripture AI Desktop App ${{ github.ref_name }}

            ### 下载链接

            **macOS:**
            - [Intel (x64)](https://github.com/aifordisciple/scripture-ai/releases/download/${{ github.ref_name }}/AI读_x64.dmg)
            - [Apple Silicon (ARM)](https://github.com/aifordisciple/scripture-ai/releases/download/${{ github.ref_name }}/AI读_aarch64.dmg)

            **Windows:**
            - [安装程序 (.exe)](https://github.com/aifordisciple/scripture-ai/releases/download/${{ github.ref_name }}/AI读_x64-setup.exe)
            - [MSI 安装包](https://github.com/aifordisciple/scripture-ai/releases/download/${{ github.ref_name }}/AI读_x64_en-US.msi)

            **Linux:**
            - [AppImage](https://github.com/aifordisciple/scripture-ai/releases/download/${{ github.ref_name }}/ai-read_x86_64.AppImage)
            - [DEB 包](https://github.com/aifordisciple/scripture-ai/releases/download/${{ github.ref_name }}/ai-read_x86_64.deb)

            ---

            ### 更新日志

            请查看 [commits](https://github.com/aifordisciple/scripture-ai/commits/${{ github.ref_name }}) 了解详细更改。
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}