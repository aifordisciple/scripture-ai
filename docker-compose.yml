services:
  web:
    container_name: scripture-ai-web
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Docker 内部网络，直接使用服务名 db
      - DATABASE_URL=postgresql://user:password@db:5432/scripture_db
      # 设置真实生产环境所需的各种 API Key (请在此处补充)
      - NEXTAUTH_SECRET=your_super_secret_key_here
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    container_name: scripture-ai-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scripture_db
    ports:
      - "5432:5432" 
    volumes:
      - ./pgdata:/var/lib/postgresql/data